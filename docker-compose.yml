services:
  postgres:
    image: postgres:15-alpine
    container_name: refnet-postgres
    environment:
      POSTGRES_DB: refnet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: refnet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: refnet-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data:
