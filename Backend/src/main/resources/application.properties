spring.application.name=RefNet-Backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/refnet_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/refnet_audit

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Logging
logging.level.org.springframework.security=DEBUG

# File Storage Configuration
file.upload-dir=./uploads
file.resume-subdir=resumes
file.photo-subdir=photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (Replace with secure keys in production)
# Base64 encoded 256-bit key
jwt.secret=9a4f4342416f424c534151524e4d415a4d4a514e42424b53414d425a4a4e4d415a4d4a514e42424b53414d425a
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# --- Phase 5: Notification System ---
# Email Mode: MOCK (default), TEST (Mailtrap), REAL (SMTP)
app.notification.email-mode=MOCK

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

